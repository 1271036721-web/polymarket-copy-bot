# Polymarket 跟单机器人 - 配置
# 回测口径：2025-07 至 2026-11，1/20 跟，手续费 1.5%、滑点 1c 时
# TruongMyLan 净 +$2,278 / royalestake +$5,576 / 0xC9BF +$25,613，合计 +$33,467
# 0xC9BF 的利润 77% 来自 2026-10 一个月，别把回测当稳赚。
# 默认 dry_run: true，只模拟、不真下单。实盘前先跑模拟盘至少 1 周。

capital_usd: 20000.0        # 2026-11-15 Dylan 决定：模拟本金提到 $20,000（原 $10,000）；注资进 state.json 现金，持仓按成本口径凑整
ratio: 0.05                  # 1/20 跟单比例
poll_seconds: 5              # 每 5 秒查一次（2026-11-13 02:37 试跑 2 秒后 API 连续超时，已改回 5 秒）
dry_run: true                # true=模拟盘，false=实盘。改 false 前必须先配好 .env

# 风控：单笔、单市场、总仓位上限，超过就跳过
max_per_trade_usd: 250.0     # 单笔最多 $250（$5,000 本金时按比例应再调低）
max_per_token_usd: 500.0     # 同一个 outcome 累计最多 $500
max_total_exposure_usd: 15000.0  # 2026-11-15 Dylan 决定：总持仓成本上限提到 $15,000（原 $8,000）；新体育目标按 1/20 需求对照此上限
min_trade_usd: 5.0           # 小于 $5 的单跳过，滑点和手续费吃掉
max_slippage: 0.10           # 2026-11-15 Dylan 决定：滑点保护加回来，现价比目标贵 10 美分以上就跳过（之前 1.0 是 2026-11-13 的“不跳滑点直接跟”，导致一批 $0.99 假价成交）
max_price: 0.97              # 价格 >0.97 不跟（已基本定胜负）
min_price: 0.03              # 价格 <0.03 不跟

# 跟单目标：2026-11-15 Dylan 决定只跟体育，不跟长期政治/加密类
# TruongMyLan 和 AllByMyseIf 已撤掉（见下方备注），目前只跟 Sisyphus-（Dota 2）
targets:
  - name: Sisyphus-
    address: "0xf3ce7f04dde4f8c5aed19a20e5ecd8520e5ca57a"
    note: "2026-11-15 新筛：全时间 +$598,145，4 个月全正，只做 Dota 2 电竞，1/20 跟只需 $181；注意 11 月仅 +$2,268，近期冷却"

# TruongMyLan 已于 2026-11-15 停跟：Dylan 决定只跟体育。长期政治/地缘/加密，
# V7 没有模型能算。撤掉时 0 个在持仓，无事可留；不再跟他的新单（包括卖单）。
# AllByMyseIf 已于 2026-11-15 停跟：同上，长期政治/地缘/加密。他的 5 笔旧持仓
# （成本 $126.67）留在 state.json 里自然结算，不再跟他的新单（包括卖单）。
# 他的 pending 碎单组（Skin cancer vaccine FDA approved by June 30, 2027? Yes）
# 已在本次部署时清掉。

# royalestake 已于 2026-11-15 停跟：4 个月只有 2 个月正，近 30 天 -$3,640，不符合稳定性标准。
# 他的 6 笔旧持仓（成本约 $877）留在 state.json 里自然结算，不再跟他的新单（包括卖单）。
# 他的 pending 碎单组已在本次部署时清掉。

# 0xC9BF 已于 2026-11-15 停跟：跟单资金 72.5% 跟他，他 24 小时亏 $20,924，
# 历史盈利 94% 集中在 2026-10 一个月。他的 4 笔旧持仓（成本约 $846）留在
# state.json 里自然结算，不再跟他的新单（包括卖单）。

# 跳过这些市场（15 分钟 BTC 做市盘跟不了，见 2026-11-13 的分析）
skip_title_contains:
  - "Bitcoin Up or Down"
  - "Ethereum Up or Down"

# 只跟 BUY。SELL 只有在我们持有同一 token 时才按比例卖出（止盈/止损退出），
# 不做空、不跟他们卖出开仓。
follow_sell_only_if_holding: true

data_api_base: "https://data-api.polymarket.com/v2"
clob_price_base: "https://clob.polymarket.com"
state_file: "state.json"
log_file: "copy_trades.csv"
