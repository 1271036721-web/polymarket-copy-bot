# Polymarket 跟单机器人 - 配置
# 回测口径：2025-07 至 2026-11，1/20 跟，手续费 1.5%、滑点 1c 时
# TruongMyLan 净 +$2,278 / royalestake +$5,576 / 0xC9BF +$25,613，合计 +$33,467
# 0xC9BF 的利润 77% 来自 2026-10 一个月，别把回测当稳赚。
# 默认 dry_run: true，只模拟、不真下单。实盘前先跑模拟盘至少 1 周。

capital_usd: 1126.76        # 2026-11-16 Dylan 决定：本金 8000 元人民币，按 7.1 折 $1,126.76（账本美元计价；原 $8,000 是美元误写，15:32 修正）
ratio: 0.05                  # 1/20 跟单比例
poll_seconds: 5              # 每 5 秒查一次（2026-11-13 02:37 试跑 2 秒后 API 连续超时，已改回 5 秒）
dry_run: true                # true=模拟盘，false=实盘。改 false 前必须先配好 .env
follow_enabled: true         # 2026-11-16 Dylan 决定：$8,000 重启，用升级后 V7 严格过滤跑（14:42 全部停跟单后恢复）
                             # true=正常跟单；false=不跟任何新单（买入/卖出都停，只记 seen_tx、不进待处理池；
                             # 待处理池清空），机器人继续跑，只做自动结算。

# 风控：单笔、单市场、总仓位上限，超过就跳过
max_per_trade_usd: 150.0     # 单笔最多 $150（2026-11-16 Dylan 决定：从 $250 降到 $150；五个 -$500 满额亏损都是 $500 单 token 上限打出来的）
max_per_token_usd: 150.0     # 同一个 outcome 累计最多 $150（2026-11-16 Dylan 决定：从 $500 降到 $150，跟单笔上限对齐，单仓最大亏损封顶 $150）
max_total_exposure_usd: 1126.76  # 2026-11-16 Dylan 决定：总持仓成本上限对齐本金 $1,126.76（8000 元人民币 @7.1；原 $8,000 是美元误写）
min_trade_usd: 5.0           # 小于 $5 的单跳过，滑点和手续费吃掉
max_slippage: 0.10           # 2026-11-15 Dylan 决定：滑点保护加回来，现价比目标贵 10 美分以上就跳过（之前 1.0 是 2026-11-13 的“不跳滑点直接跟”，导致一批 $0.99 假价成交）
max_price: 0.97              # 价格 >0.97 不跟（已基本定胜负）
min_price: 0.03              # 价格 <0.03 不跟

# 跟单目标：2026-11-15 Dylan 决定只跟体育，名单按小黄鸡自己的判断定
# （2026-11-15 23:56 Dylan 说“还是跟你自己的判断”）
# 跟三个：0x9f15613e（NFL+足球）、Sisyphus-（Dota 2）、Raisuu（UFC+NBA+NHL）。
# 不跟 GeorgeRe：V7 打不了（88% 盘中单局胜负）且与 Sisyphus- 同场相关，跟了等于 Dota 2 翻倍；他是 Sisyphus- 的替补。
# V7 严格门槛：赔率 1.30–1.80（框架稳定赔率窗）、U3 每天同类型 2 场、否决清单 2 次强失败；电竞盘中全跳过
# （2026-11-16 Dylan 决定停电竞盘中跟单：已实现 -$3,579 里电竞盘中单局占 -$2,517；cannot_score
# 不再放行，Dota 2 / CS2 / LoL / Valorant / KPL 任何盘口都不跟）；单笔上限 $150（原 $250）、
# 单 token 上限 $150（原 $500）。观察模式继续跑（v7-copy-observe-10m 每 10 分钟打分 + update_vetoes
# 更新否决清单），复盘时间 Dylan 定。
# 本金 $20,000 不变：三人 1/20 持仓需求 $9,486 + $1,530 + $241 = $11,257，cap 余量约 $13,110，够用。
targets: []  # 2026-11-16 Dylan 决定：这三个人都不跟了（0x9f15613e、Sisyphus-、Raisuu 全部撤掉）。
  # 8000 元人民币（账本约 $1,127）模拟盘继续跑着等新目标：严格 V7 门槛、$150 上限、10c 滑点保护都在；新目标筛出来
  # 再加回名单。跟单开关 follow_enabled 保持 true（名单为空所以实际无单可跟）。

